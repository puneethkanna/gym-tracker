<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker - Option C: Minimal Clean</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0D9488',
            brandLight: '#14B8A6'
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-slate-900 font-sans min-h-screen">
  <div class="max-w-sm mx-auto min-h-screen bg-slate-50">
    <!-- Header -->
    <header class="bg-white p-6 pb-4 shadow-sm sticky top-0 z-20">
      <div class="flex justify-between items-center mb-6">
        <div>
          <p class="text-xs text-slate-500 font-medium tracking-wide">THURSDAY, APR 17</p>
          <h1 class="text-2xl font-semibold text-slate-900 mt-1">Workout</h1>
        </div>
        <button class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center">
          <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        </button>
      </div>

      <!-- Streak Banner -->
      <div class="bg-gradient-to-r from-brand to-brandLight rounded-2xl p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          </div>
          <div>
            <p class="text-white/80 text-xs">Current streak</p>
            <p class="text-white font-semibold">14 days</p>
          </div>
        </div>
        <span class="text-white/80 text-xs">🔥</span>
      </div>
    </header>

    <!-- Workout Types -->
    <section class="p-6 pb-4">
      <div class="grid grid-cols-2 gap-3">
        <button class="bg-white rounded-2xl p-5 text-left shadow-sm border border-slate-100 hover:border-brand transition-colors">
          <div class="w-10 h-10 rounded-xl bg-orange-100 mb-3 flex items-center justify-center">
            <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          </div>
          <h3 class="font-semibold text-slate-900">Push</h3>
          <p class="text-xs text-slate-500 mt-1">Chest, Shoulders, Triceps</p>
        </button>
        <button class="bg-white rounded-2xl p-5 text-left shadow-sm border border-slate-100 hover:border-brand transition-colors">
          <div class="w-10 h-10 rounded-xl bg-blue-100 mb-3 flex items-center justify-center">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <h3 class="font-semibold text-slate-900">Pull</h3>
          <p class="text-xs text-slate-500 mt-1">Back, Biceps</p>
        </button>
        <button class="bg-white rounded-2xl p-5 text-left shadow-sm border border-slate-100 hover:border-brand transition-colors">
          <div class="w-10 h-10 rounded-xl bg-green-100 mb-3 flex items-center justify-center">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <h3 class="font-semibold text-slate-900">Legs</h3>
          <p class="text-xs text-slate-500 mt-1">Quads, Hamstrings</p>
        </button>
        <button class="bg-white rounded-2xl p-5 text-left shadow-sm border border-slate-100 hover:border-brand transition-colors">
          <div class="w-10 h-10 rounded-xl bg-purple-100 mb-3 flex items-center justify-center">
            <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          </div>
          <h3 class="font-semibold text-slate-900">Cardio</h3>
          <p class="text-xs text-slate-500 mt-1">Running, Cycling</p>
        </button>
      </div>
    </section>

    <!-- This Week -->
    <section class="px-6 pb-24">
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">This Week</h2>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-medium">Mon</span>
          <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </span>
        </div>
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-medium">Tue</span>
          <span class="w-8 h-8 rounded-full bg-brand flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </span>
        </div>
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-medium">Wed</span>
          <span class="w-8 h-8 rounded-full bg-brand flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </span>
        </div>
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-medium">Thu</span>
          <span class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white text-xs font-medium">Now</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-sm font-medium">Fri</span>
          <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          </span>
        </div>
      </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4">
      <div class="max-w-sm mx-auto flex justify-around">
        <button class="flex flex-col items-center gap-1 text-brand">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span class="text-[10px] font-medium">Progress</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
          <span class="text-[10px] font-medium">Settings</span>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
