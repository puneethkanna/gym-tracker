<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker - Option B: Glass Dark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#8B5CF6',
            success: '#10B981'
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen">
  <!-- Gradient Background -->
  <div class="fixed inset-0 z-0">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-accent/20 rounded-full blur-[128px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-emerald-500/15 rounded-full blur-[128px]"></div>
  </div>

  <div class="relative z-10 max-w-md mx-auto min-h-screen">
    <!-- Header -->
    <header class="p-6 pt-8">
      <div class="flex justify-between items-end mb-8">
        <div>
          <p class="text-sm text-gray-400 mb-1">Good evening</p>
          <h1 class="text-3xl font-semibold tracking-tight">Let's <span class="text-accent">train</span></h1>
        </div>
        <div class="w-10 h-10 rounded-full glass flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- Weekly Progress Ring -->
      <div class="glass-card rounded-3xl p-6 mb-6">
        <div class="flex items-center gap-6">
          <div class="relative w-20 h-20">
            <svg class="w-20 h-20 -rotate-90" viewBox="0 0 36 36">
              <path class="text-gray-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
              <path class="text-accent" stroke-dasharray="75, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-lg font-semibold">75%</span>
            </div>
          </div>
          <div>
            <h3 class="font-semibold text-lg mb-1">Weekly Goal</h3>
            <p class="text-sm text-gray-400">4 of 5 workouts</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Quick Action -->
    <div class="px-6 mb-8">
      <button class="w-full glass-card hover:bg-white/10 rounded-2xl p-5 flex items-center gap-4 transition-all duration-300 group">
        <div class="w-14 h-14 rounded-2xl bg-accent/20 flex items-center justify-center group-hover:scale-110 transition-transform">
          <svg class="w-7 h-7 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </div>
        <div class="text-left">
          <h3 class="font-semibold">Start Workout</h3>
          <p class="text-sm text-gray-400">Push, Pull, Legs, or Custom</p>
        </div>
        <svg class="w-5 h-5 text-gray-500 ml-auto group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Today's Schedule -->
    <section class="px-6 mb-8">
      <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Today</h2>
      <div class="glass rounded-2xl p-5">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="flex-1">
            <h3 class="font-semibold">Upper Body</h3>
            <p class="text-sm text-gray-400">Completed • 45 min</p>
          </div>
          <span class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full">Done</span>
        </div>
      </div>
    </section>

    <!-- Recent Workouts -->
    <section class="px-6 pb-24">
      <h2 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Recent</h2>
      <div class="space-y-3">
        <div class="glass-card rounded-2xl p-4 flex items-center gap-4 cursor-pointer hover:bg-white/10 transition-colors">
          <div class="w-12 h-12 rounded-xl bg-purple-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div class="flex-1">
            <h3 class="font-medium">Leg Day</h3>
            <p class="text-sm text-gray-400">Quads, Hamstrings, Calves</p>
          </div>
          <span class="text-xs text-gray-500">2d ago</span>
        </div>
        <div class="glass-card rounded-2xl p-4 flex items-center gap-4 cursor-pointer hover:bg-white/10 transition-colors">
          <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <div class="flex-1">
            <h3 class="font-medium">Pull Day</h3>
            <p class="text-sm text-gray-400">Back, Biceps</p>
          </div>
          <span class="text-xs text-gray-500">3d ago</span>
        </div>
      </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-4">
      <div class="max-w-md mx-auto flex justify-around">
        <button class="flex flex-col items-center gap-1 text-accent">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span class="text-[10px] font-medium">Stats</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
          <span class="text-[10px] font-medium">Settings</span>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
